# Mod version: bump it when the mod itself changes (not when the pack changes: the pack updates by itself).
modVersion=1.0.4

# The link of ResourcePack.zip (Google Drive "anyone with the link" works). Used when the manifest carries no "url" of its own. Fill in your own.
packShareUrl=

# The link of ResourcePack.manifest.json (written by make-manifest.bat: the pack's SHA-1 and size). The mod checks this small file at every launch.
packManifestUrl=

# The file name the pack gets in every player's resourcepacks folder (and in options.txt as file/<name>).
packFileName=ResourcePack.zip

org.gradle.jvmargs=-Xmx1G
